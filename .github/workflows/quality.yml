name: Pull Request Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build must not use the actual production database or secrets.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/johnscott_ci
      SESSION_SECRET: ci-only-session-signing-secret-that-is-not-used-in-production
      CRON_SECRET: ci-only-cron-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (no external NHL registry refresh)
        run: npm run build

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-test-only
          POSTGRES_DB: johnscott_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d johnscott_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-local-test-only@127.0.0.1:5432/johnscott_e2e
      SESSION_SECRET: ci-only-session-signing-secret-that-is-not-used-in-production
      CRON_SECRET: ci-only-cron-secret-that-is-not-used-in-production
      SEED_EMPTY_LEAGUE: YES_I_HAVE_VERIFIED_THE_DATABASE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Initialize disposable PostgreSQL schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Seed disposable league fixture
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run prisma:seed
      - name: Verify database-backed API and deterministic rules
        run: npx playwright test --project=chromium
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  # Simulates the real production upgrade path: main's old schema had been
  # created with `prisma db push` and contains populated league data.
  # Every URL below points to a throwaway in-run GitHub Actions PostgreSQL.
  legacy-upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-legacy-upgrade-only
          POSTGRES_DB: johnscott_legacy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d johnscott_legacy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-legacy-upgrade-only@127.0.0.1:5432/johnscott_legacy_e2e
      SESSION_SECRET: ci-only-session-signing-secret-that-is-not-used-in-production
      CRON_SECRET: ci-only-cron-secret-that-is-not-used-in-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reproduce pre-migration database from main without destructive operations
        run: |
          git show origin/main:prisma/schema.prisma > "$RUNNER_TEMP/pre-migration-schema.prisma"
          npx prisma db push --schema "$RUNNER_TEMP/pre-migration-schema.prisma" --skip-generate
      - name: Populate legacy test league
        env:
          SEED_EMPTY_LEAGUE: YES_I_HAVE_VERIFIED_THE_DATABASE
        run: npm run prisma:seed
      - name: Read-only audit confirms legacy schema is unbaselined
        run: |
          node scripts/migration-preflight.mjs > "$RUNNER_TEMP/preflight-before.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/preflight-before.json", "utf8"))
          if (report.verdict !== "UNBASELINED_POPULATED_SCHEMA" || !report.legacyPinColumnHasDefault) {
            throw new Error("Fixture did not reproduce the populated legacy schema and insecure PIN default")
          }
          NODE
      - name: Record existing identities and record counts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import { PrismaClient } from "@prisma/client"
          const db = new PrismaClient()
          try {
            const [managers, teams, rosters, matchups] = await Promise.all([
              db.user.findMany({ select: { id: true }, orderBy: { id: "asc" } }),
              db.team.findMany({ select: { id: true }, orderBy: { id: "asc" } }),
              db.rosterSlot.count(), db.matchup.count(),
            ])
            if (teams.length !== 12 || rosters === 0 || matchups === 0) throw new Error("Legacy fixture is not populated")
            fs.writeFileSync(process.env.RUNNER_TEMP + "/before-upgrade.json", JSON.stringify({ managers, teams, rosters, matchups }))
          } finally { await db.$disconnect() }
          NODE
      - name: Baseline old schema and apply additive migrations
        run: |
          # Existing db-push databases must NOT re-run baseline CREATE TABLE statements.
          npx prisma migrate resolve --applied 20261113000000_baseline
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Verify schema parity and retained league records
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
          node scripts/migration-preflight.mjs > "$RUNNER_TEMP/preflight-after.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/preflight-after.json", "utf8"))
          if (report.verdict !== "HISTORY_READY" || report.legacyPinColumnHasDefault || report.pendingMigrations.length !== 0) {
            throw new Error("Migration did not fully reconcile history or clear the legacy PIN default")
          }
          NODE
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import { PrismaClient } from "@prisma/client"
          const db = new PrismaClient()
          try {
            const [managers, teams, rosters, matchups] = await Promise.all([
              db.user.findMany({ select: { id: true }, orderBy: { id: "asc" } }),
              db.team.findMany({ select: { id: true }, orderBy: { id: "asc" } }),
              db.rosterSlot.count(), db.matchup.count(),
            ])
            const before = fs.readFileSync(process.env.RUNNER_TEMP + "/before-upgrade.json", "utf8")
            const after = JSON.stringify({ managers, teams, rosters, matchups })
            if (before !== after) throw new Error("Legacy league records changed during additive migration")
            const [plans, snapshots] = await Promise.all([db.lineupPlan.count(), db.dailyGameLineup.count()])
            if (plans !== 0 || snapshots !== 0) throw new Error("Migration should not manufacture historical lineups")
            console.log("Legacy migration succeeded: identities and data preserved, no fabricated snapshots")
          } finally { await db.$disconnect() }
          NODE
