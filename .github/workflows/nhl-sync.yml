name: Live NHL Score Sync

on:
  schedule:
    # Runs every 5 minutes from 23:00 to 05:00 UTC (evening NHL game window)
    - cron: '*/5 0-5,23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NHL Sync Endpoint
        run: |
          curl -f -s "https://${{ secrets.VERCEL_APP_URL }}/api/cron/sync?secret=${{ secrets.CRON_SECRET }}"
