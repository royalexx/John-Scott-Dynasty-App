name: Live NHL Score Sync

on:
  schedule:
    # Every 5 minutes across matinees and the evening window, including late West Coast OT (16:00–08:59 UTC).
    - cron: '*/5 0-8,16-23 * * *'
    # Daily morning reconciliation for final boxscores and official NHL stat corrections (13:00 UTC).
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NHL Sync Endpoint
        run: |
          curl -f -s "https://${{ secrets.VERCEL_APP_URL }}/api/cron/sync?secret=${{ secrets.CRON_SECRET }}"
